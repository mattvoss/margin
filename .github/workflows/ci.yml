name: CI

on:
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - "stats/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "stats/**"

jobs:
  # ── TanStack Start app (UI + /api) ───────────────────────────────────────
  app:
    name: "App (ubuntu)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ── Docker image ─────────────────────────────────────────────────────────
  docker:
    name: "Docker build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t margin:ci .
